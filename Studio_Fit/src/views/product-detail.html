<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Fit - Detalle del Producto</title>
    <link rel="stylesheet" href="/src/styles/variables.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header style="border-bottom: 1px solid #d4af37; padding: 1rem 0;">
        <div class="header-container" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem;">
            <a class="logo" onclick="app.navigateTo('home')" style="cursor: pointer; color: #d4af37; font-size: 1.5rem; font-weight: bold; text-decoration: none;">Studio Fit</a>
            <nav>
                <ul style="list-style: none; display: flex; gap: 2rem; margin: 0; padding: 0; flex-wrap: wrap; font-size: 0.95rem;">
                    <li><a href="#" onclick="app.navigateTo('catalog'); return false;" style="color: white; text-decoration: none;">Catálogo</a></li>
                    <li><a href="#" onclick="app.navigateTo('community'); return false;" style="color: white; text-decoration: none;">Comunidad</a></li>
                    <li><a href="#" onclick="app.navigateTo('publish-product'); return false;" style="color: white; text-decoration: none;">Publicar</a></li>
                    <li><a href="#" onclick="app.navigateTo('about'); return false;" style="color: white; text-decoration: none;">Nosotros</a></li>
                    <li><a href="#" onclick="app.navigateTo('classes'); return false;" style="color: white; text-decoration: none;">Clases</a></li>
                    <li><a href="#" onclick="app.navigateTo('contact'); return false;" style="color: white; text-decoration: none;">Contacto</a></li>
                    <li><a href="#" onclick="app.navigateTo('admin'); return false;" style="color: #d4af37; text-decoration: none; font-weight: 600; border: 1px solid #d4af37; padding: 0.4rem 0.8rem; border-radius: 4px;">Admin</a></li>
                    <li><a href="#" id="profile-link" onclick="app.navigateTo('login'); return false;" style="color: white; text-decoration: none;">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="flex: 1;">
        <div class="detail-container">
            <div class="detail-image" id="product-image" style="position: relative; width: 100%; height: 400px; overflow: hidden; background: rgba(212, 175, 55, 0.1); border-radius: 12px;">
                <div id="product-badge" style="position: absolute; top: 15px; right: 15px; padding: 0.7rem 1.5rem; border-radius: 20px; font-size: 0.9rem; font-weight: 600; color: white; z-index: 10; display: none;"></div>
                <img src="" alt="Producto" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="detail-info">
                <h1 id="product-name">Cargando producto...</h1>
                <p class="detail-price" id="product-price">$0.00</p>
                <p class="detail-description" id="product-description">Descripción del producto</p>

                <!-- Selector de Cantidad -->
                <div class="quantity-selector" style="margin: 2rem 0;">
                    <label style="color: #d4af37; font-weight: 600; display: block; margin-bottom: 0.8rem;">Cantidad:</label>
                    <div style="display: flex; align-items: center; gap: 1rem; max-width: 200px;">
                        <button class="qty-btn" onclick="app.decreaseDetailQuantity()" style="background: rgba(212, 175, 55, 0.2); border: 1px solid #d4af37; color: #d4af37; width: 40px; height: 40px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 1.2rem;">−</button>
                        <input type="number" id="detail-quantity" value="1" min="1" style="flex: 1; padding: 0.6rem; border: 1px solid #d4af37; border-radius: 4px; background: rgba(255, 255, 255, 0.05); color: #e0e0e0; text-align: center; font-weight: 600; font-size: 1rem;">
                        <button class="qty-btn" onclick="app.increaseDetailQuantity()" style="background: rgba(212, 175, 55, 0.2); border: 1px solid #d4af37; color: #d4af37; width: 40px; height: 40px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 1.2rem;">+</button>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="btn btn-primary" id="add-to-cart" style="flex: 1; min-width: 200px;" onclick="app.addToCartFromDetail()">Agregar al Carrito</button>
                    <button class="btn" onclick="app.navigateTo('catalog')">Volver al Catálogo</button>
                </div>
            </div>
        </div>

        <!-- Productos Relacionados -->
        <div class="related-products-section" style="margin-top: 4rem; padding: 2rem; background: rgba(212, 175, 55, 0.05); border: 2px solid rgba(212, 175, 55, 0.3); border-radius: 12px;">
            <h2 style="color: #d4af37; font-size: 1.8rem; margin-top: 0; margin-bottom: 2rem;">Productos Relacionados</h2>
            <div id="related-products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem;">
                <!-- Los productos relacionados se cargarán aquí -->
            </div>
        </div>
    </main>

    <footer style="background: linear-gradient(135deg, #050813 0%, #0a0e27 100%); border-top: 2px solid #d4af37; padding: 2rem; margin-top: 3rem;">
        <div style="max-width: 1200px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h3 style="color: #d4af37; margin-top: 0;">Síguenos</h3>
                <div style="display: flex; justify-content: center; gap: 2rem;">
                    <a href="#" style="font-size: 1.5rem; text-decoration: none; color: #d4af37; cursor: not-allowed;"><i class="fab fa-facebook"></i></a>
                    <a href="#" style="font-size: 1.5rem; text-decoration: none; color: #d4af37; cursor: not-allowed;"><i class="fab fa-instagram"></i></a>
                    <a href="#" style="font-size: 1.5rem; text-decoration: none; color: #d4af37; cursor: not-allowed;"><i class="fab fa-tiktok"></i></a>
                    <a href="#" style="font-size: 1.5rem; text-decoration: none; color: #d4af37; cursor: not-allowed;"><i class="fab fa-twitter"></i></a>
                    <a href="#" style="font-size: 1.5rem; text-decoration: none; color: #d4af37; cursor: not-allowed;"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
            <p style="text-align: center; color: #888;">&copy; 2024 Studio Fit. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
