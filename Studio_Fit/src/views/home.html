<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Fit - Inicio</title>
    <link rel="stylesheet" href="/src/styles/variables.css">
</head>
<body>
    <div style="
        min-height: 100vh;
        background: linear-gradient(135deg, var(--dark-bg-primary) 0%, var(--dark-bg-secondary) 100%);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow-y: auto;
        position: relative;
    ">
        <!-- LOGO SUPERIOR -->
        <div style="padding: 0.8rem; text-align: center; border-bottom: 2px solid var(--primary-gold);">
            <h1 style="
                font-size: 3rem;
                color: var(--primary-gold);
                margin: 0;
                letter-spacing: 3px;
                text-shadow: 0 2px 10px var(--primary-gold-shadow);
            ">STUDIO FIT</h1>
            <p style="color: var(--primary-gold-light); margin: 0.2rem 0 0 0; font-size: 0.75rem;">Tu camino al bienestar comienza aquí</p>
        </div>

        <!-- CONTENEDOR PRINCIPAL: CARRUSEL + PRE-REGISTRO -->
        <div style="
            flex: 1;
            display: flex;
            padding: 0rem;
            align-items: stretch;
            justify-content: space-between;
            width: 100%;
            gap: 0;
        ">
            <!-- CARRUSEL LADO IZQUIERDO 75% -->
            <div style="
                flex: 3;
                display: flex;
                padding: 0rem;
                align-items: center;
                justify-content: center;
            ">
            <!-- CARRUSEL FULLSCREEN -->
            <div style="display: flex; flex-direction: column; justify-content: flex-start; height: 100%; width: 100%;">
                <div id="carousel-slide" class="carousel-slide" style="
                    border: 3px solid var(--primary-gold);
                    border-radius: 12px;
                    text-align: center;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    box-shadow: 0 8px 32px var(--primary-gold-shadow-light);
                    height: 65vh;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    overflow: hidden;
                    position: relative;
                " onclick="app.handleCarouselClick()" onmouseover="this.style.boxShadow='0 12px 40px var(--primary-gold-shadow-medium)'; this.style.transform='scale(1.01)'" onmouseout="this.style.boxShadow='0 8px 32px var(--primary-gold-shadow-light)'; this.style.transform='scale(1)'">
                    
                    <!-- SLIDE 1: LOGIN -->
                    <div id="slide-1" style="
                        width: 100%;
                        height: 100%;
                        display: none;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        position: relative;
                    ">
                        <img src="/imagen/login.png" alt="Login" style="
                            width: 100%;
                            height: 100%;
                            object-fit: fill;
                        ">
                    </div>

                    <!-- SLIDE 2: CLASES -->
                    <div id="slide-2" style="
                        width: 100%;
                        height: 100%;
                        display: none;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        position: relative;
                    ">
                        <img src="/imagen/clases.png" alt="Clases" style="
                            width: 100%;
                            height: 100%;
                            object-fit: fill;
                        ">
                    </div>

                    <!-- SLIDE 3: PRODUCTOS -->
                    <div id="slide-3" style="
                        width: 100%;
                        height: 100%;
                        display: none;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        position: relative;
                    ">
                        <img src="/imagen/catalogo.png" alt="Productos" style="
                            width: 100%;
                            height: 100%;
                            object-fit: fill;
                        ">
                    </div>

                    <!-- SLIDE 4: INSTALACIONES -->
                    <div id="slide-4" style="
                        width: 100%;
                        height: 100%;
                        display: none;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        position: relative;
                    ">
                        <img src="/imagen/instalaciones.png" alt="Instalaciones" style="
                            width: 100%;
                            height: 100%;
                            object-fit: fill;
                        ">
                    </div>
                </div>

                <!-- DOTS DEL CARRUSEL -->
                <div class="carousel-dots" id="carousel-dots" style="padding: 0.3rem 0; justify-content: center; display: flex;">
                </div>
            </div>
            </div>

            <!-- PRE-REGISTRO LADO DERECHO 25% -->
            <div style="
                flex: 1;
                background: linear-gradient(135deg, rgba(5, 8, 19, 0.95) 0%, rgba(10, 14, 39, 0.95) 100%);
                border-left: 3px solid var(--primary-gold);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            ">
                <div style="
                    width: 100%;
                    max-width: 250px;
                    text-align: center;
                ">
                    <h2 style="
                        font-size: 1.6rem;
                        color: var(--primary-gold);
                        margin: 0 0 0.5rem 0;
                        font-weight: bold;
                    ">¡Únete Hoy!</h2>
                    <p style="
                        font-size: 0.85rem;
                        color: var(--text-muted-dark);
                        margin: 0 0 1.5rem 0;
                    ">Sé parte de Studio Fit</p>

                    <form style="
                        display: flex;
                        flex-direction: column;
                        gap: 0.8rem;
                    " onsubmit="event.preventDefault(); app.showAlert('success', '¡Bienvenido! Explora nuestra web');">
                        <input type="text" placeholder="Nombre" style="
                            padding: 0.6rem;
                            border: 1px solid var(--primary-gold);
                            background: rgba(0, 0, 0, 0.3);
                            border-radius: 6px;
                            color: var(--text-light);
                            font-size: 0.85rem;
                            transition: all 0.3s ease;
                        " onfocus="this.style.background='rgba(212, 175, 55, 0.1)'; this.style.borderColor='var(--primary-gold-light)'" onblur="this.style.background='rgba(0, 0, 0, 0.3)'; this.style.borderColor='var(--primary-gold)'" readonly>

                        <input type="email" placeholder="correo@email.com" style="
                            padding: 0.6rem;
                            border: 1px solid var(--primary-gold);
                            background: rgba(0, 0, 0, 0.3);
                            border-radius: 6px;
                            color: var(--text-light);
                            font-size: 0.85rem;
                            transition: all 0.3s ease;
                        " onfocus="this.style.background='rgba(212, 175, 55, 0.1)'; this.style.borderColor='var(--primary-gold-light)'" onblur="this.style.background='rgba(0, 0, 0, 0.3)'; this.style.borderColor='var(--primary-gold)'" readonly>

                        <input type="password" placeholder="Contraseña" style="
                            padding: 0.6rem;
                            border: 1px solid var(--primary-gold);
                            background: rgba(0, 0, 0, 0.3);
                            border-radius: 6px;
                            color: var(--text-light);
                            font-size: 0.85rem;
                            transition: all 0.3s ease;
                        " onfocus="this.style.background='rgba(212, 175, 55, 0.1)'; this.style.borderColor='var(--primary-gold-light)'" onblur="this.style.background='rgba(0, 0, 0, 0.3)'; this.style.borderColor='var(--primary-gold)'" readonly>

                        <button type="submit" style="
                            padding: 0.7rem;
                            background-color: var(--primary-gold);
                            color: var(--dark-bg-primary);
                            border: none;
                            border-radius: 6px;
                            font-weight: bold;
                            cursor: pointer;
                            transition: all 0.3s ease;
                            font-size: 0.9rem;
                        " onmouseover="this.style.backgroundColor='var(--primary-gold-light)'; this.style.transform='scale(1.02)'" onmouseout="this.style.backgroundColor='var(--primary-gold)'; this.style.transform='scale(1)'">Registrarse</button>
                    </form>

                    <div style="
                        text-align: center;
                        color: var(--text-muted-dark);
                        margin: 1rem 0;
                        font-size: 0.8rem;
                    ">O</div>

                    <div style="
                        text-align: center;
                        font-size: 0.85rem;
                    ">
                        <span style="color: var(--text-muted-dark);">¿Ya tienes cuenta?</span> <a onclick="app.navigateTo('login')" style="
                            color: var(--primary-gold);
                            text-decoration: none;
                            cursor: pointer;
                            transition: all 0.3s ease;
                        " onmouseover="this.style.textDecoration='underline'; this.style.color='var(--primary-gold-light)'" onmouseout="this.style.textDecoration='none'; this.style.color='var(--primary-gold)'">Inicia sesión</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER MINIMO -->
        <footer style="
            background: var(--dark-overlay);
            border-top: 1px solid var(--primary-gold-border);
            padding: 0.6rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
        ">
            <p style="margin: 0;">&copy; 2024 Studio Fit. Tu tienda de fitness digital.</p>
        </footer>
    </div>
</body>
</html>
