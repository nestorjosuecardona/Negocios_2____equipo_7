<!-- Historial de Compras -->
<header style="border-bottom: 1px solid #d4af37; padding: 0.6rem 0; background-color: #050813;">
  <div class="header-container" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem;">
    <a class="logo" onclick="app.navigateTo('home')" style="cursor: pointer; color: #d4af37; font-size: 1.2rem; font-weight: bold; text-decoration: none;">Studio Fit</a>
    <nav>
      <ul style="list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0; flex-wrap: wrap; font-size: 0.85rem;">
        <li><a href="#" onclick="app.navigateTo('catalog'); return false;" style="color: white; text-decoration: none;">Catálogo</a></li>
        <li><a href="#" onclick="app.navigateTo('about'); return false;" style="color: white; text-decoration: none;">Nosotros</a></li>
        <li><a href="#" onclick="app.navigateTo('classes'); return false;" style="color: white; text-decoration: none;">Clases</a></li>
        <li><a href="#" onclick="app.navigateTo('contact'); return false;" style="color: white; text-decoration: none;">Contacto</a></li>
        <li><a href="#" onclick="app.handleLogout(); return false;" style="color: #e74c3c; font-weight: bold;">Cerrar Sesión</a></li>
      </ul>
    </nav>
  </div>
</header>

<main style="min-height: 100vh; background: linear-gradient(135deg, #050813 0%, #0a0e27 100%); padding: 1.5rem;">
  <div style="max-width: 1000px; margin: 0 auto;">

    <!-- Título -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="color: #d4af37; font-size: 2rem; margin: 0 0 0.5rem 0; font-weight: 900;">📦 Historial de Compras</h1>
      <p style="color: #aaa; font-size: 0.95rem; margin: 0;">Todas tus transacciones y facturas en un solo lugar</p>
    </div>

    <!-- Tabla de Historial -->
    <div id="purchaseHistoryContainer" style="background: #0a0e27; border: 2px solid #d4af37; border-radius: 10px; overflow: hidden;">
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; color: #ddd;">
          <thead>
            <tr style="background: rgba(212, 175, 55, 0.1); border-bottom: 2px solid #d4af37;">
              <th style="padding: 1rem; text-align: left; color: #d4af37; font-weight: 700; font-size: 0.9rem;">Orden #</th>
              <th style="padding: 1rem; text-align: left; color: #d4af37; font-weight: 700; font-size: 0.9rem;">Fecha</th>
              <th style="padding: 1rem; text-align: left; color: #d4af37; font-weight: 700; font-size: 0.9rem;">Total</th>
              <th style="padding: 1rem; text-align: left; color: #d4af37; font-weight: 700; font-size: 0.9rem;">Estado</th>
              <th style="padding: 1rem; text-align: center; color: #d4af37; font-weight: 700; font-size: 0.9rem;">Acción</th>
            </tr>
          </thead>
          <tbody id="purchaseHistoryList">
            <!-- Se cargan dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Botón de volver -->
    <div style="text-align: center; margin-top: 2rem;">
      <button onclick="app.navigateTo('dashboard')" style="padding: 0.7rem 1.5rem; background: rgba(212, 175, 55, 0.2); border: 2px solid #d4af37; color: #d4af37; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: 0.3s;" 
              onmouseover="this.style.background='rgba(212, 175, 55, 0.3)'" 
              onmouseout="this.style.background='rgba(212, 175, 55, 0.2)'">
        ← Volver al Dashboard
      </button>
    </div>

  </div>
</main>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #050813;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  @media (max-width: 768px) {
    table {
      font-size: 0.8rem !important;
    }

    th, td {
      padding: 0.7rem !important;
    }

    h1 {
      font-size: 1.5rem !important;
    }
  }
</style>
