<div class="auction-container">
  <div class="auction-header">
    <h1>🔨 Subasta en Vivo</h1>
    <p>Puja por el mejor producto de esta semana</p>
  </div>

  <div class="auction-content">
    <div class="auction-product-section">
      <div class="auction-image-container">
        <img id="auctionImage" src="" alt="Producto en subasta" class="auction-image">
        <div class="auction-timer">
          <div class="timer-icon">⏱️</div>
          <div id="auctionTimer" class="timer-display">2h 34m</div>
        </div>
      </div>

      <div class="auction-details">
        <h2 id="auctionProductName"></h2>
        <p id="auctionDescription" class="auction-product-description"></p>

        <div class="current-bid-section">
          <div class="bid-label">Oferta Actual</div>
          <div id="currentBidAmount" class="bid-amount">$520</div>
          <div id="bidsCountDisplay" class="bids-count">12 pujas registradas</div>
        </div>

        <div class="bid-form">
          <h3>Haz tu Oferta</h3>
          <div class="bid-input-group">
            <span class="currency">$</span>
            <input type="number" id="bidAmount" placeholder="Cantidad" min="1" step="10">
          </div>
          <button onclick="app.placeBid()" class="btn-place-bid">Ofertar Ahora</button>
        </div>
      </div>
    </div>

    <div class="auction-bids-history">
      <h3>Historial de Pujas</h3>

        <!-- Se cargan dinámicamente -->
      </div>
    </div>
